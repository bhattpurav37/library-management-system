spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:librarydb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      # NOTE: in a real production system schema changes should be owned by a
      # migration tool (Flyway/Liquibase) with ddl-auto set to validate. Left as
      # update here to keep the exercise self-contained without a migrations
      # module - see ASSUMPTIONS.md.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
