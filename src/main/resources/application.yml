spring:
  application:
    name: library-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 10

server:
  port: ${SERVER_PORT:8881}
  servlet:
    context-path: /library

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.library: ${LOG_LEVEL:INFO}

app:
  kafka:
    topics:
      # Where BookCreatedEvent messages are published after a book registration commits.
      book-created: ${KAFKA_TOPIC_BOOK_CREATED:library.book-created.v1}
  security:
    jwt:
      # HS256 signing key for both issuing and validating access tokens. Base64-encoded,
      # env-overridable so production can inject its own secret (12-factor). The default is a
      # throwaway dev key long enough for HS256 (>= 256 bits).
      secret: ${JWT_SECRET:bGlicmFyeS1kZXYtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMTIzNDU2Nzg5MA==}
      access-token-ttl-minutes: ${JWT_TTL_MINUTES:60}
