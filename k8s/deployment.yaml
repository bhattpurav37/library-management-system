apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
  labels:
    app: library-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-api
  template:
    metadata:
      labels:
        app: library-api
    spec:
      containers:
        - name: library-api
          image: library-management-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8881
          envFrom:
            - configMapRef:
                name: library-api-config
            - secretRef:
                name: library-api-secrets
          readinessProbe:
            httpGet:
              path: /library/actuator/health
              port: 8881
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /library/actuator/health
              port: 8881
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
